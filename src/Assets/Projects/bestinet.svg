<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='800' viewBox='0 0 1280 800' role='img' aria-label='A time-based one-time password: a thirty-second countdown ring above a six-digit code'>
  <defs>
    <linearGradient id='panel' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#23263E'/>
      <stop offset='100%' stop-color='#12141F'/>
    </linearGradient>
    <linearGradient id='arc' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#c770f0'/>
      <stop offset='100%' stop-color='#7b4dff'/>
    </linearGradient>
    <linearGradient id='chip' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#2C2F4A'/>
      <stop offset='100%' stop-color='#1A1C2C'/>
    </linearGradient>
  </defs>

  <rect width='1280' height='800' fill='none'/>

  <ellipse cx='640' cy='742' rx='232' ry='24' fill='#000000' opacity='0.20'/>

  <rect x='340' y='96' width='600' height='608' rx='48' fill='url(#panel)' stroke='#3A3E5C' stroke-width='2'/>

  <g transform='translate(640 176)'>
    <rect x='-15' y='-4' width='30' height='22' rx='5' fill='none' stroke='#c770f0' stroke-width='3.5'/>
    <path d='M -8 -4 v -7 a 8 8 0 0 1 16 0 v 7' fill='none' stroke='#c770f0' stroke-width='3.5' stroke-linecap='round'/>
  </g>

  <g transform='translate(640 330)'>
    <circle r='112' fill='none' stroke='#2E3150' stroke-width='16'/>
    <circle r='112' fill='none' stroke='url(#arc)' stroke-width='16' stroke-linecap='round'
            stroke-dasharray='497 208' transform='rotate(-90)'/>
    <text x='0' y='16' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif'
          font-size='82' font-weight='600' fill='#EDE9F7'>21</text>
    <text x='0' y='58' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif'
          font-size='22' letter-spacing='3' fill='#8E93B8'>SECONDS</text>
  </g>

  <g font-family='Consolas, Menlo, monospace' font-size='54' font-weight='600' fill='#EDE9F7' text-anchor='middle'>
    <rect x='382' y='498' width='76' height='98' rx='14' fill='url(#chip)' stroke='#3A3E5C' stroke-width='1.5'/>
    <text x='420' y='564'>4</text>
    <rect x='470' y='498' width='76' height='98' rx='14' fill='url(#chip)' stroke='#3A3E5C' stroke-width='1.5'/>
    <text x='508' y='564'>9</text>
    <rect x='558' y='498' width='76' height='98' rx='14' fill='url(#chip)' stroke='#3A3E5C' stroke-width='1.5'/>
    <text x='596' y='564'>2</text>
    <rect x='646' y='498' width='76' height='98' rx='14' fill='url(#chip)' stroke='#3A3E5C' stroke-width='1.5'/>
    <text x='684' y='564'>7</text>
    <rect x='734' y='498' width='76' height='98' rx='14' fill='url(#chip)' stroke='#3A3E5C' stroke-width='1.5'/>
    <text x='772' y='564'>1</text>
    <rect x='822' y='498' width='76' height='98' rx='14' fill='url(#chip)' stroke='#3A3E5C' stroke-width='1.5'/>
    <text x='860' y='564'>5</text>
  </g>

  <text x='640' y='650' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif'
        font-size='24' letter-spacing='1' fill='#8E93B8'>TIME-BASED ONE-TIME PASSWORD</text>
</svg>
